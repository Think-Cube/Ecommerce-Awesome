name: Add Resource
description: Suggest a new tool or resource for the list
title: "Add: "
labels: ["add", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a resource! Please fill in the details below.

  - type: input
    id: name
    attributes:
      label: Tool / Resource Name
      placeholder: e.g. Klaviyo
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: Link to official website or GitHub repository
      placeholder: https://
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong to? Or suggest a new one.
      placeholder: e.g. Email Marketing
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: One-line description
      description: A concise description (max 120 chars). Start with lowercase letter, end with period.
      placeholder: "email marketing platform with automation and segmentation for e-commerce."
    validations:
      required: true

  - type: checkboxes
    id: criteria
    attributes:
      label: Criteria
      options:
        - label: Actively maintained (last release or commit within 2 years)
          required: true
        - label: Well documented
          required: true
        - label: Not already in the list
          required: true
